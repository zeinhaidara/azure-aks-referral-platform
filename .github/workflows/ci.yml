---
# Offline checks only: nothing here needs an Azure account, credentials or state.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff infra
      - name: Validate prod (backend disabled)
        working-directory: infra/environments/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate
      # infra/environments/dev is not validated: its main.tf declares private_dns and
      # private_endpoints twice with different arguments (see README). That needs a
      # decision on the intended configuration, not a CI change.
      - name: Validate modules against the provider version the environments lock (azurerm 4.81.0)
        run: |
          for dir in infra/modules/*/; do
            echo "::group::${dir}"
            cat > "${dir}ci_pin_override.tf" <<'EOF'
          terraform {
            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = "4.81.0"
              }
            }
          }
          EOF
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Lint
        run: |
          helm lint deploy/helm/referrals
          helm lint deploy/helm/referrals -f deploy/helm/referrals/values-dev.yaml
      # values.yaml deliberately requires the identity client IDs, so the chart renders with the dev values
      - name: Render with dev values
        run: helm template referrals deploy/helm/referrals -f deploy/helm/referrals/values-dev.yaml > /dev/null

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install yamllint
      # Helm templates are Go templates, not plain YAML, so only the plain YAML files are linted
      - name: YAML
        run: >-
          yamllint -d relaxed .github/workflows pipelines
          deploy/helm/referrals/Chart.yaml deploy/helm/referrals/values.yaml
          deploy/helm/referrals/values-dev.yaml
      - name: Python syntax
        run: python -m compileall -q app
